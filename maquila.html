<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALLTANSA – Maquila</title>
<style>
  :root {
    --navy:   #1B2A4A;
    --red:    #C0391B;
    --light:  #F4F6FA;
    --white:  #FFFFFF;
    --border: #D0D7E3;
    --text:   #1a1a2e;
    --muted:  #6c757d;
    --green:  #198754;
    --yellow: #ffc107;
    --orange: #fd7e14;
    --blue:   #0d6efd;
    --shadow: 0 2px 8px rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--light); color: var(--text); font-size: 14px; }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; height: 54px; position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo { height: 34px; }
  .topbar-title { font-size: 15px; font-weight: 700; letter-spacing: .4px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .btn-topbar {
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.25);
    color: #fff; padding: 5px 13px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: background .2s;
  }
  .btn-topbar:hover { background: rgba(255,255,255,.22); }
  .btn-topbar.danger { background: rgba(192,57,27,.35); border-color: rgba(192,57,27,.5); }
  .topbar-user { font-size: 12px; opacity: .75; }

  /* ── MAIN LAYOUT ── */
  #appScreen { display: block; }
  .main-wrap { max-width: 100%; margin: 0 auto; padding: 18px 20px 40px; }

  /* ── SUMMARY ── */
  .summary-row { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .summary-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 18px; text-align:center; min-width:120px; box-shadow: var(--shadow); border-top: 4px solid var(--navy); }
  .summary-card.orange { border-top-color: var(--orange); }
  .summary-card.red    { border-top-color: var(--red); }
  .summary-card .sv { font-size:24px; font-weight:800; color:var(--navy); line-height:1; }
  .summary-card .sl { font-size:11px; color:var(--muted); margin-top:4px; text-transform: uppercase; letter-spacing: .4px; }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; flex-wrap: nowrap; align-items: center; gap: 8px;
    margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px;
  }
  .toolbar-left  { display: flex; gap: 8px; flex-wrap: nowrap; flex: 1; min-width: 0; }
  .toolbar-right { display: flex; gap: 8px; flex-wrap: nowrap; flex-shrink: 0; }
  .search-input {
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; width: 260px; min-width: 140px; flex-shrink: 1; outline: none;
  }
  .search-input:focus { border-color: var(--navy); }
  .btn {
    padding: 7px 16px; border-radius: 7px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: opacity .2s; white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-outline { background: #fff; color: var(--navy); border: 1px solid var(--navy); }

  /* ── TABLE ── */
  .table-wrap {
    overflow-x: hidden; border-radius: 10px; box-shadow: var(--shadow);
    max-height: calc(100vh - 300px); overflow-y: auto; background: var(--white);
  }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--white); font-size: 12.5px; }
  thead th {
    background: var(--navy); color: #fff; padding: 8px 6px;
    text-align: left; font-weight: 600; white-space: nowrap;
    position: sticky; top: 0; z-index: 2; overflow: hidden; text-overflow: ellipsis;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: #f0f4ff; }
  tbody tr.row-alert { background: #fdeeec; }
  tbody tr.row-alert:hover { background: #fbe1de; }
  tbody td { padding: 5px 6px; vertical-align: middle; overflow: hidden; }
  .empty-row td { text-align: center; color: var(--muted); padding: 32px; font-style: italic; }

  .cell-input {
    width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 12.5px; font-family: inherit; outline: none; background: #fff;
  }
  .cell-input:focus { border-color: var(--navy); }
  /* Anchos por porcentaje — suman 100%, así la tabla nunca necesita scroll
     horizontal sin importar el ancho de pantalla; el texto largo se trunca
     con "..." (Modelo, con tooltip) o se ajusta en varias líneas (Comentarios). */
  .col-folio     { width: 8%; }
  .col-cliente   { width: 8%; }
  .col-modelo    { width: 11%; }
  .col-servicio  { width: 9%; }
  .col-proveedor { width: 8%; }
  .col-oc        { width: 6%; }
  .col-fecha     { width: 7%; }
  .col-factura   { width: 7%; }
  .col-comentarios { width: 12%; }
  .col-acciones  { width: 8%; text-align: center; }

  .col-derivada {
    display: block; font-size: 12px; color: var(--text); padding: 4px 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .col-derivada:empty::before { content: '–'; color: var(--muted); }

  .cell-textarea {
    width: 100%; min-height: 30px; max-height: 70px; resize: vertical;
    padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; font-family: inherit; outline: none; background: #fff;
    white-space: normal; overflow-wrap: break-word;
  }
  .cell-textarea:focus { border-color: var(--navy); }

  /* Pastillas de estatus (Recogido / Factura / Pago) */
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px;
    border-radius: 20px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    white-space: nowrap; border: 1px solid transparent; width: 100%; justify-content: center;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pill-ok { background: #e8f5e9; color: var(--green); border-color: #b6e0bb; }
  .pill-ok:hover { background: #d9f0db; }
  .pill-pendiente { background: #fff3e6; color: var(--orange); border-color: #ffd9ad; }
  .pill-pendiente:hover { background: #ffe9d1; }

  .alert-badge {
    display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700;
    color: var(--red); background: #fdeeec; border: 1px solid #f3c8c2;
    border-radius: 10px; padding: 1px 7px; white-space: nowrap;
  }

  .btn-icon { background: none; border: none; cursor: pointer; font-size: 15px; padding: 2px 5px; border-radius: 4px; }
  .btn-icon:hover { background: #e9ecef; }
  .btn-icon:disabled { opacity: .35; cursor: not-allowed; }
  .btn-icon:disabled:hover { background: none; }
  .acciones-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .acciones-botones { display: flex; gap: 2px; justify-content: center; }
  .fecha-cierre-tag { font-size: 9.5px; color: var(--muted); white-space: nowrap; }

  .chk-completados {
    display: flex; align-items: center; gap: 6px; font-size: 13px;
    color: var(--text); white-space: nowrap; cursor: pointer; user-select: none;
    padding: 0 4px;
  }
  .chk-completados input { cursor: pointer; width: 15px; height: 15px; }

  /* Loading */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center; z-index: 9000;
  }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; padding: 10px 22px; border-radius: 8px;
    font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0;
    transition: opacity .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--red); }
  #toast.success { background: var(--green); }

  @media(max-width:600px){
    .topbar-title { font-size: 13px; }
    tbody td, thead th { padding: 6px 6px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="spinner"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- APP -->
<div id="appScreen">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <img class="topbar-logo" src="logo.png" alt="ALLTANSA" onerror="this.style.display='none'"/>
      <span class="topbar-title">Control de Maquila</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-user">Dirección</span>
      <button class="btn-topbar" onclick="window.open('https://alltansacloud.github.io/alltansa-board/','_self')">Board Principal</button>
      <button class="btn-topbar" onclick="window.open('https://alltansacloud.github.io/alltansa-board/cotizaciones.html','_blank')">Cotizaciones</button>
    </div>
  </div>

  <div class="main-wrap">

    <!-- RESUMEN -->
    <div class="summary-row">
      <div class="summary-card">
        <div class="sv" id="sumTotal">0</div>
        <div class="sl">Envíos totales</div>
      </div>
      <div class="summary-card orange">
        <div class="sv" id="sumSinEnviar">0</div>
        <div class="sl">Sin enviar</div>
      </div>
      <div class="summary-card orange">
        <div class="sv" id="sumSinRegresar">0</div>
        <div class="sl">Sin regresar</div>
      </div>
      <div class="summary-card red">
        <div class="sv" id="sumAlerta">0</div>
        <div class="sl">+10 días sin regresar</div>
      </div>
      <div class="summary-card orange">
        <div class="sv" id="sumSinPagar">0</div>
        <div class="sl">Servicios sin pagar</div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" class="search-input" id="buscador" placeholder="🔍 Buscar por folio, cliente, proveedor, OC, factura o comentario..." oninput="renderMaquilaList()"/>
        <label class="chk-completados">
          <input type="checkbox" id="chkVerCompletados" onchange="toggleVerCompletados()"/>
          <span id="lblVerCompletados">Ver completados (0)</span>
        </label>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-primary" id="btnAgregarEnvio" onclick="agregarEnvio()">＋ Agregar envío</button>
      </div>
    </div>

    <!-- TABLA -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-folio">Folio ALLTANSA</th>
            <th class="col-cliente">Cliente</th>
            <th class="col-modelo">Modelo</th>
            <th class="col-servicio">Servicio</th>
            <th class="col-proveedor">Proveedor</th>
            <th class="col-oc">OC ALLTANSA</th>
            <th class="col-fecha">Enviado</th>
            <th class="col-fecha">Recogido</th>
            <th class="col-factura">Factura</th>
            <th class="col-fecha">Pago</th>
            <th class="col-comentarios">Comentarios</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="maquilaTbody">
          <tr class="empty-row"><td colspan="12">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<datalist id="foliosDatalist"></datalist>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/AKfycbxFGplnK4-63imhYKIjfDsrlblmp1d-FU1BPzdA0LtImKaRjdEqYal32CBrVmJ4GGE3uw/exec';
const API_TOKEN = 'segurid@d-ALLTANSA';
const DIAS_ALERTA_SIN_REGRESAR = 10;
const SERVICIOS = ['Rolado', 'Formado de tapas', 'Otro'];

let currentUser = null;
let allMaquila = [];
let editingCell = null; // { id, field } — celda tipo pastilla actualmente en edición
let foliosCache = [];   // [{folio, cliente}] — vía getFoliosLigero, no carga pedidos completos
let verCompletados = false; // toggle de la vista: pendientes (default) vs completados/archivados

/* ═══════════════════════════════════════════
   INICIO — sin login: el acceso se controla entrando desde el botón
   "🏭 Maquila" dentro de Compras en el Board, que ya requiere sesión ahí.
═══════════════════════════════════════════ */
function iniciarApp() {
  currentUser = { area: 'Dirección' };
  loadFoliosLigero();
  loadMaquila();
  iniciarChequeoVersion();
}

/* ═══════════════════════════════════════════
   DATA
═══════════════════════════════════════════ */
async function loadFoliosLigero() {
  try {
    const r = await fetch(`${API}?action=getFoliosLigero&_tk=${API_TOKEN}`);
    const d = await r.json();
    foliosCache = d.folios || [];
    const dl = document.getElementById('foliosDatalist');
    dl.innerHTML = foliosCache.map(f => `<option value="${escHtml(f.folio)}">${escHtml(f.folio)} — ${escHtml(f.cliente||'')} — ${escHtml(f.modelo||'')}</option>`).join('');
    // getMaquila puede resolver antes que este catálogo — si la tabla ya se
    // pintó sin el catálogo listo, Cliente/Modelo se quedarían en blanco.
    // Se vuelve a pintar aquí para refrescarlos sin importar el orden de llegada.
    if (allMaquila.length) renderMaquilaList();
  } catch(e) { /* si falla, el folio sigue siendo editable como texto libre */ }
}

async function loadMaquila() {
  setLoading(true);
  try {
    const r = await fetch(`${API}?action=getMaquila&_tk=${API_TOKEN}`);
    const d = await r.json();
    allMaquila = d.items || [];
    setLoading(false);
    renderMaquilaList();
  } catch(e) {
    setLoading(false);
    showToast('Error al cargar los envíos.', 'error');
  }
}

async function guardarCampo(id, field, value) {
  const item = allMaquila.find(m => String(m.id) === String(id));
  if (!item) return;
  item[field] = value;
  try {
    const body = new FormData();
    body.append('action', 'saveMaquila');
    body.append('data', JSON.stringify({ id, [field]: value }));
    body.append('_tk', API_TOKEN);
    await fetch(API, { method: 'POST', body });
  } catch(e) {
    showToast('No se pudo guardar el cambio. Intenta de nuevo.', 'error');
  }
}

async function agregarEnvio() {
  const nuevo = {
    folio_pedido: '', servicio: 'Rolado', proveedor: PROVEEDOR_DEFAULT['Rolado'], oc_alltansa: '',
    fecha_envio: '', fecha_recogido: '', factura: '', fecha_pago: '',
    modificado_por: 'Dirección'
  };
  setLoading(true);
  try {
    const body = new FormData();
    body.append('action', 'saveMaquila');
    body.append('data', JSON.stringify(nuevo));
    body.append('_tk', API_TOKEN);
    const r = await fetch(API, { method: 'POST', body });
    const d = await r.json();
    setLoading(false);
    if (!d.success) { showToast('No se pudo crear el envío.', 'error'); return; }
    nuevo.id = d.id;
    allMaquila.unshift(nuevo);
    renderMaquilaList();
  } catch(e) {
    setLoading(false);
    showToast('Error de conexión al crear el envío.', 'error');
  }
}

async function eliminarEnvio(id) {
  if (!confirm('¿Eliminar este registro de maquila? No se puede deshacer.')) return;
  setLoading(true);
  try {
    const r = await fetch(`${API}?action=deleteMaquila&id=${encodeURIComponent(id)}&_tk=${API_TOKEN}`);
    const d = await r.json();
    setLoading(false);
    if (d.error) { showToast(d.error, 'error'); return; }
    allMaquila = allMaquila.filter(m => String(m.id) !== String(id));
    renderMaquilaList();
    showToast('Registro eliminado.', 'success');
  } catch(e) {
    setLoading(false);
    showToast('Error de conexión al eliminar.', 'error');
  }
}

/* ═══════════════════════════════════════════
   CERRAR / REABRIR — archiva un envío a "Completados" cuando las 4 etapas
   (Enviado/Recogido/Factura/Pago) ya están en verde. No se elimina el
   registro, solo se marca `cerrado` para sacarlo de la vista activa y de
   los contadores del resumen. `reabrirEnvio` revierte el marcado.
═══════════════════════════════════════════ */
function maquilaCompleta(m) {
  return !!(m.fecha_envio && m.fecha_recogido && m.factura && m.fecha_pago);
}

async function cerrarEnvio(id) {
  const item = allMaquila.find(m => String(m.id) === String(id));
  if (!item || !maquilaCompleta(item)) return; // el botón ya debería estar deshabilitado en este caso
  if (!confirm('¿Cerrar este pedido de maquila? Pasará a la pestaña de completados.')) return;
  const fecha = todayStr();
  setLoading(true);
  try {
    const body = new FormData();
    body.append('action', 'saveMaquila');
    body.append('data', JSON.stringify({ id, cerrado: true, fecha_cierre: fecha }));
    body.append('_tk', API_TOKEN);
    await fetch(API, { method: 'POST', body });
    item.cerrado = true;
    item.fecha_cierre = fecha;
    setLoading(false);
    renderMaquilaList();
    showToast('Pedido cerrado y archivado.', 'success');
  } catch(e) {
    setLoading(false);
    showToast('No se pudo cerrar el pedido. Intenta de nuevo.', 'error');
  }
}

async function reabrirEnvio(id) {
  const item = allMaquila.find(m => String(m.id) === String(id));
  if (!item) return;
  if (!confirm('¿Reabrir este pedido? Volverá a la lista de pendientes.')) return;
  setLoading(true);
  try {
    const body = new FormData();
    body.append('action', 'saveMaquila');
    body.append('data', JSON.stringify({ id, cerrado: false, fecha_cierre: '' }));
    body.append('_tk', API_TOKEN);
    await fetch(API, { method: 'POST', body });
    item.cerrado = false;
    item.fecha_cierre = '';
    setLoading(false);
    renderMaquilaList();
    showToast('Pedido reabierto.', 'success');
  } catch(e) {
    setLoading(false);
    showToast('No se pudo reabrir el pedido. Intenta de nuevo.', 'error');
  }
}

function toggleVerCompletados() {
  verCompletados = document.getElementById('chkVerCompletados').checked;
  const btnAdd = document.getElementById('btnAgregarEnvio');
  if (btnAdd) btnAdd.style.display = verCompletados ? 'none' : '';
  renderMaquilaList();
}

/* ═══════════════════════════════════════════
   EDICIÓN INLINE
═══════════════════════════════════════════ */
function updateCampoTexto(id, field, value) {
  guardarCampo(id, field, value);
}

// Proveedor por default según el tipo de servicio — la casilla sigue siendo
// editable, esto solo precarga el valor más común para agilizar la captura.
const PROVEEDOR_DEFAULT = {
  'Rolado': 'PAILERIA RUIZ',
  'Formado de tapas': 'SILSA',
  'Otro': ''
};

function updateServicio(id, servicio) {
  const item = allMaquila.find(m => String(m.id) === String(id));
  if (!item) return;
  const nuevoProveedor = PROVEEDOR_DEFAULT[servicio] !== undefined ? PROVEEDOR_DEFAULT[servicio] : (item.proveedor || '');
  item.servicio = servicio;
  item.proveedor = nuevoProveedor;
  guardarCampo(id, 'servicio', servicio);
  guardarCampo(id, 'proveedor', nuevoProveedor);
  renderMaquilaList(); // cambio discreto (onchange, no tecla a tecla) — seguro re-renderizar aquí
}

// Busca folio en el catálogo ligero (getFoliosLigero) y regresa {cliente, modelo}
// para las columnas derivadas de la tabla. No hace ninguna llamada al servidor
// por tecla — usa el catálogo ya cargado en memoria (foliosCache).
function obtenerInfoFolio(folio) {
  if (!folio) return { cliente: '', modelo: '' };
  const norm = s => String(s||'').trim().toLowerCase();
  const match = foliosCache.find(f => norm(f.folio) === norm(folio));
  return match ? { cliente: match.cliente||'', modelo: match.modelo||'' } : { cliente: '', modelo: '' };
}

// Actualiza SOLO el texto de las columnas Cliente/Modelo, sin re-renderizar
// la tabla — igual que el fix del bug de Cotización Express: reconstruir la
// fila en cada tecla le quitaría el foco al campo de folio.
function mostrarInfoFolio(id, value) {
  const info = obtenerInfoFolio(value);
  const elC = document.getElementById('clienteCell_' + id);
  const elM = document.getElementById('modeloCell_' + id);
  if (elC) elC.textContent = info.cliente;
  if (elM) elM.textContent = info.modelo;
}

function abrirEdicionPastilla(id, field) {
  editingCell = { id, field };
  renderMaquilaList();
}

function guardarPastilla(id, field, value) {
  editingCell = null;
  guardarCampo(id, field, value);
  renderMaquilaList();
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function renderMaquilaList() {
  const tbody = document.getElementById('maquilaTbody');
  const q = (document.getElementById('buscador').value || '').trim().toLowerCase();

  // Vista activa: solo pendientes por cerrar (default) o solo completados/archivados.
  const base = allMaquila.filter(m => verCompletados ? !!m.cerrado : !m.cerrado);
  let items = base.slice();
  if (q) {
    items = items.filter(m => {
      const info = obtenerInfoFolio(m.folio_pedido);
      return String(m.folio_pedido||'').toLowerCase().includes(q) ||
      String(info.cliente||'').toLowerCase().includes(q) ||
      String(info.modelo||'').toLowerCase().includes(q) ||
      String(m.servicio||'').toLowerCase().includes(q) ||
      String(m.proveedor||'').toLowerCase().includes(q) ||
      String(m.oc_alltansa||'').toLowerCase().includes(q) ||
      String(m.factura||'').toLowerCase().includes(q) ||
      String(m.comentarios||'').toLowerCase().includes(q);
    });
  }

  // Orden descendente por folio (más recientes primero). Al comparar por la
  // MISMA llave, todas las filas de un folio repetido (ej. un pedido con
  // Rolado Y Formado de tapas) quedan una junto a la otra automáticamente.
  items.sort((a, b) => compareFolioDesc(a.folio_pedido, b.folio_pedido));

  actualizarResumen();

  if (!items.length) {
    const msg = verCompletados
      ? 'Sin pedidos completados todavía'
      : (base.length ? 'Sin resultados para tu búsqueda' : 'Sin envíos registrados — usa "＋ Agregar envío"');
    tbody.innerHTML = `<tr class="empty-row"><td colspan="12">${msg}</td></tr>`;
    return;
  }

  tbody.innerHTML = items.map(m => {
    const dias = diasSinRegreso(m);
    const alerta = !m.fecha_recogido && dias !== null && dias > DIAS_ALERTA_SIN_REGRESAR;
    const info = obtenerInfoFolio(m.folio_pedido);
    return `<tr class="${alerta ? 'row-alert' : ''}">
      <td><input class="cell-input" list="foliosDatalist" value="${escHtml(m.folio_pedido||'')}" placeholder="A-YYMM-##"
          oninput="mostrarInfoFolio('${m.id}',this.value)"
          onchange="updateCampoTexto('${m.id}','folio_pedido',this.value)"/></td>
      <td><span class="col-derivada" id="clienteCell_${m.id}" title="${escHtml(info.cliente)}">${escHtml(info.cliente)}</span></td>
      <td><span class="col-derivada" id="modeloCell_${m.id}" title="${escHtml(info.modelo)}">${escHtml(info.modelo)}</span></td>
      <td><select class="cell-input" onchange="updateServicio('${m.id}',this.value)">
        ${SERVICIOS.map(s => `<option value="${s}" ${m.servicio===s?'selected':''}>${s}</option>`).join('')}
      </select></td>
      <td><input class="cell-input" value="${escHtml(m.proveedor||'')}" placeholder="Proveedor"
          onchange="updateCampoTexto('${m.id}','proveedor',this.value)"/></td>
      <td><input class="cell-input" value="${escHtml(m.oc_alltansa||'')}" placeholder="OC"
          onchange="updateCampoTexto('${m.id}','oc_alltansa',this.value)"/></td>
      <td>${celdaFecha(m, 'fecha_envio')}</td>
      <td>${celdaFecha(m, 'fecha_recogido')}${alerta ? `<span class="alert-badge">⚠ ${dias}d</span>` : ''}</td>
      <td>${celdaFactura(m)}</td>
      <td>${celdaFecha(m, 'fecha_pago')}</td>
      <td><textarea class="cell-textarea" placeholder="Ej. Proveedor pide anticipo / entrega con material incluido..."
          onchange="updateCampoTexto('${m.id}','comentarios',this.value)">${escHtml(m.comentarios||'')}</textarea></td>
      <td class="col-acciones">${accionesCell(m)}</td>
    </tr>`;
  }).join('');
}

// Celda de fecha: si tiene valor se muestra en verde (pastilla) con la fecha
// formateada; si está pendiente se muestra la pastilla naranja "PENDIENTE".
// Al hacer clic se convierte en un <input type="date"> real para capturar
// o corregir la fecha. `esOpcional` distingue Recogido/Pago (pueden estar
// pendientes) de Enviado (siempre tiene valor, se ve en azul/navy).
function celdaFecha(m, field) {
  const val = m[field] || '';
  const enEdicion = editingCell && String(editingCell.id) === String(m.id) && editingCell.field === field;
  if (enEdicion) {
    return `<input type="date" class="cell-input" value="${val}" autofocus
      onchange="guardarPastilla('${m.id}','${field}',this.value)"
      onblur="if(editingCell && editingCell.id=='${m.id}' && editingCell.field=='${field}'){editingCell=null;renderMaquilaList();}"/>`;
  }
  if (!val) {
    return `<div class="pill pill-pendiente" onclick="abrirEdicionPastilla('${m.id}','${field}')">PENDIENTE</div>`;
  }
  return `<div class="pill pill-ok" onclick="abrirEdicionPastilla('${m.id}','${field}')">${fmtFechaCorta(val)}</div>`;
}

function celdaFactura(m) {
  const val = m.factura || '';
  const enEdicion = editingCell && String(editingCell.id) === String(m.id) && editingCell.field === 'factura';
  if (enEdicion) {
    return `<input type="text" class="cell-input" value="${escHtml(val)}" placeholder="Núm. factura" autofocus
      onchange="guardarPastilla('${m.id}','factura',this.value)"
      onblur="if(editingCell && editingCell.id=='${m.id}' && editingCell.field=='factura'){editingCell=null;renderMaquilaList();}"/>`;
  }
  if (!val) {
    return `<div class="pill pill-pendiente" onclick="abrirEdicionPastilla('${m.id}','factura')">PENDIENTE</div>`;
  }
  return `<div class="pill pill-ok" onclick="abrirEdicionPastilla('${m.id}','factura')">${escHtml(val)}</div>`;
}

// Celda de acciones: en la vista activa ofrece "Cerrar" (deshabilitado hasta
// que Enviado/Recogido/Factura/Pago estén los 4 en verde) + "Eliminar"; en la
// vista de completados ofrece "Reabrir" + "Eliminar", y muestra la fecha de cierre.
function accionesCell(m) {
  if (m.cerrado) {
    return `<div class="acciones-cell">
      <div class="acciones-botones">
        <button class="btn-icon" title="Reabrir pedido" onclick="reabrirEnvio('${m.id}')">↩️</button>
        <button class="btn-icon" title="Eliminar" onclick="eliminarEnvio('${m.id}')">🗑️</button>
      </div>
      ${m.fecha_cierre ? `<span class="fecha-cierre-tag">Cerrado ${fmtFechaCorta(m.fecha_cierre)}</span>` : ''}
    </div>`;
  }
  const completo = maquilaCompleta(m);
  const btnCerrar = completo
    ? `<button class="btn-icon" title="Cerrar pedido (pasa a Completados)" onclick="cerrarEnvio('${m.id}')">🔒</button>`
    : `<button class="btn-icon" disabled title="Completa Enviado, Recogido, Factura y Pago para poder cerrar este pedido">🔒</button>`;
  return `<div class="acciones-botones">
    ${btnCerrar}
    <button class="btn-icon" title="Eliminar" onclick="eliminarEnvio('${m.id}')">🗑️</button>
  </div>`;
}

function actualizarResumen() {
  const activos = allMaquila.filter(m => !m.cerrado);
  const total = activos.length;
  const sinEnviar = activos.filter(m => !m.fecha_envio).length;
  const sinRegresar = activos.filter(m => m.fecha_envio && !m.fecha_recogido).length;
  const alerta = activos.filter(m => {
    const d = diasSinRegreso(m);
    return !m.fecha_recogido && d !== null && d > DIAS_ALERTA_SIN_REGRESAR;
  }).length;
  const sinPagar = activos.filter(m => !m.fecha_pago).length;
  document.getElementById('sumTotal').textContent = total;
  document.getElementById('sumSinEnviar').textContent = sinEnviar;
  document.getElementById('sumSinRegresar').textContent = sinRegresar;
  document.getElementById('sumAlerta').textContent = alerta;
  document.getElementById('sumSinPagar').textContent = sinPagar;
  // Contador de completados junto al checkbox de la barra de herramientas
  const completadosCount = allMaquila.length - total;
  const lbl = document.getElementById('lblVerCompletados');
  if (lbl) lbl.textContent = `Ver completados (${completadosCount})`;
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
// Ordena folios tipo "A-2607-39" o "STK-2608-02" de forma numérica real
// (año-mes y consecutivo), no como texto plano — así "A-2608-02" queda
// arriba de "A-2607-39" y no al revés como saldría con orden alfabético.
function compareFolioDesc(folioA, folioB) {
  const parse = f => {
    const m = String(f||'').match(/^([A-Za-z]+)-(\d+)-(\d+)$/);
    return m ? { anioMes: parseInt(m[2],10), consecutivo: parseInt(m[3],10) } : null;
  };
  const pa = parse(folioA), pb = parse(folioB);
  if (pa && pb) {
    if (pa.anioMes !== pb.anioMes) return pb.anioMes - pa.anioMes;
    return pb.consecutivo - pa.consecutivo;
  }
  // Folio con formato distinto o vacío — respaldo por texto descendente
  return String(folioB||'').localeCompare(String(folioA||''));
}

// Fecha local (no UTC) — mismo criterio que today() en apps_script.js
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function diasSinRegreso(m) {
  if (!m.fecha_envio) return null;
  const envio = new Date(m.fecha_envio + 'T00:00:00');
  const hoy = new Date(todayStr() + 'T00:00:00');
  if (isNaN(envio.getTime())) return null;
  return Math.floor((hoy - envio) / 86400000);
}

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtFechaCorta(iso) {
  if (!iso) return '–';
  const [y,m,d] = iso.split('-');
  if (!y||!m||!d) return iso;
  return `${d}-${MESES[parseInt(m,10)-1]}-${y.slice(2)}`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.className = '', 3000);
}

function setLoading(v) {
  document.getElementById('loadingOverlay').style.display = v ? 'flex' : 'none';
}

/* ═══════════════════════════════════════════
   CHEQUEO DE VERSIÓN — version.json comparte llaves con
   index.html / cotizaciones.html; este módulo usa la llave "maquila".
═══════════════════════════════════════════ */
const APP_VERSION = '2026-08-18-1230';
let _versionCheckTimer = null;

function _mostrarTagVersion(){
  if (document.getElementById('appVersionTag')) return;
  const el = document.createElement('div');
  el.id = 'appVersionTag';
  el.style.cssText = 'position:fixed;bottom:4px;left:8px;font-size:10px;color:#9aa3b5;z-index:50;pointer-events:none;opacity:.7;font-family:inherit';
  el.textContent = 'v' + APP_VERSION;
  document.body.appendChild(el);
}

function _mostrarBannerNuevaVersion(){
  if (document.getElementById('bannerNuevaVersion')) return;
  const b = document.createElement('div');
  b.id = 'bannerNuevaVersion';
  b.style.cssText = 'position:fixed;bottom:16px;right:16px;background:var(--navy,#1B2A4A);color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;max-width:320px';
  b.innerHTML = '<span>Hay una actualización disponible.</span><button style="background:#fff;color:#1B2A4A;border:none;padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0" onclick="location.reload()">Recargar</button>';
  document.body.appendChild(b);
}

async function _chequearVersionNueva(){
  try{
    const r = await fetch('version.json?_=' + Date.now(), { cache:'no-store' });
    if (!r.ok) return;
    const data = await r.json();
    if (data && data.maquila && data.maquila !== APP_VERSION) _mostrarBannerNuevaVersion();
  }catch(e){ /* silencioso */ }
}

function iniciarChequeoVersion(){
  _mostrarTagVersion();
  _chequearVersionNueva();
  if (_versionCheckTimer) clearInterval(_versionCheckTimer);
  _versionCheckTimer = setInterval(()=>{
    if (document.hidden) return;
    _chequearVersionNueva();
  }, 5*60*1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) _chequearVersionNueva();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  iniciarApp();
});
</script>
